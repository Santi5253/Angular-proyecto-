<header class="topbar">
  <div class="brand">
    <img src="/img/logo.png" alt="Logo Cigarrería" class="logo-img" />
    <div>
      <h2>Caja Registradora</h2>
      <p>Cigarrería</p>
    </div>
  </div>
  @if (usuario) {
  <nav class="nav-links">
    <a routerLink="/inventario" routerLinkActive="active">Inventario</a>
    <a routerLink="/factura" routerLinkActive="active">Factura</a>
    <a routerLink="/historial" routerLinkActive="active">Historial</a>
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <div class="user-chip">
      <span class="avatar">{{ usuario.nombre.charAt(0) }}</span>
      <span>{{ usuario.nombre }}</span>
    </div>
    <button type="button" (click)="logout()">Salir</button>
  </nav>
  }
</header>

<div class="page-header">
  <h1>Sistema de Caja - Tienda / Cigarrería</h1>
  <p>Registro de ventas, productos y cierre diario</p>
</div>

<main class="content">
  <router-outlet></router-outlet>
</main>
