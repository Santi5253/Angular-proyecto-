<div class="login-wrapper">
  <div class="login-card">
    <div class="login-img-wrap">
      <img src="/img/login.png" alt="Login" class="login-img" />
    </div>
    <h1>Caja Registradora</h1>
    <p class="subtitle">Cigarrería — Sistema de ventas</p>
    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Usuario</mat-label>
        <input matInput formControlName="username" />
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" formControlName="password" />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>
      @if (error) { <p class="error">{{ error }}</p> }
      <button mat-raised-button color="primary" type="submit" [disabled]="cargando" class="btn-login">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
    <p class="hint">Demo: <strong>admin</strong> / <strong>admin123</strong></p>
  </div>
</div>
